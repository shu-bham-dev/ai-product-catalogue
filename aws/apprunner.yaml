version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm --prefix backend ci
      - npm --prefix backend run build
run:
  runtime-version: 20
  command: node backend/dist/server.js
  network:
    port: 4000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PRODUCT_DATA_SOURCE
      value: fakestore
    - name: EMAIL_PROVIDER
      value: memory
